<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fire Top Up</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 450px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .topup {
      width: 90%;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Free Fire Top Up</h1>
    <p>বাংলাদেশের সেরা টপ আপ অ্যাপ</p>

    <input type="text" placeholder="Free Fire Player ID">

    <h2>Diamond Package</h2>

    <button>100 Diamonds</button>
    <button>310 Diamonds</button>
    <button>520 Diamonds</button>

    <br>

    <button class="topup">Top Up করুন</button>
  </div>

</body>
</html>
